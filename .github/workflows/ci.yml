# 质量门写在 Taskfile.yml 里，这里只负责调它：本地 `task check` 与 CI 跑的是同一条命令，
# 所以不存在「本地绿、CI 红」这种由两套命令造成的漂移。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Go 版本从 go.mod 读，不在这里再写一遍 —— 两处各写一个版本号就是一个会漂移的地方。
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v3
        with:
          version: 3.x

      - name: 质量门：gofmt ＋ vet ＋ test
        run: task check

      # vet 与 test 只保证包能编译，不保证 ./cmd/twin 链得出来 —— 而 ldflags 注入版本号这条
      # 路只有在构建时才走。所以构建本身也是一道判据，顺便冒烟一次 version。
      - name: 构建并冒烟
        run: |
          task build
          ./twin version
